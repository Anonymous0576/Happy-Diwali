<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Logged Web App</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        h2, h3 {
            color: #818cf8;
            margin-top: 0;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background: var(--primary);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #4338ca;
        }

        .hidden {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        th, td {
            border: 1px solid #334155;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #312e81;
        }

        .badge {
            background: #059669;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
    </style>

    <!-- Firebase App & Firestore CDNs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- User Login / Entry Section -->
    <div class="container" id="loginCard">
        <h2>👋 Welcome! Please Enter Your Details</h2>
        <p>Aapka naam aur activity cloud database me securely record ki jayegi.</p>
        <input type="text" id="userNameInput" placeholder="Apna Naam Likhein (e.g. Adarsh)">
        <button onclick="registerUserLogin()">Enter Site</button>
    </div>

    <!-- Main Dashboard Section -->
    <div class="container hidden" id="mainDashboard">
        <h2>🚀 Dashboard</h2>
        <p>Welcome, <span id="displayName" style="color: #38bdf8; font-weight: bold;"></span>!</p>
        <button onclick="logUserActivity('Clicked Interactive Button')">⚡ Click to Test Activity</button>
        <hr style="border-color: #334155; margin: 20px 0;">
        
        <button style="background: #0f172a; border: 1px solid #818cf8;" onclick="openAdminPanel()">🔐 Developer Admin Panel</button>
    </div>

    <!-- Admin Panel -->
    <div class="container hidden" id="adminPanel">
        <h3>🛡️ Cloud Analytics & User Logs</h3>
        <p style="font-size: 0.85rem; color: #94a3b8;">Yeh data Firebase Firestore database se live fetch ho raha hai.</p>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Name</th>
                        <th>IP / Device Info</th>
                        <th>Activity</th>
                    </tr>
                </thead>
                <tbody id="logTableBody"></tbody>
            </table>
        </div>
        <button style="background: #b91c1c; margin-top: 15px;" onclick="closeAdminPanel()">Close Panel</button>
    </div>

    <script>
        // --- YOUR FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAyBR9YbGKCSa4BBIxm_Ep3GhhhMsIk3rY",
            authDomain: "diwali-database.firebaseapp.com",
            projectId: "diwali-database",
            storageBucket: "diwali-database.firebasestorage.app",
            messagingSenderId: "1091780343201",
            appId: "1:1091780343201:web:ec2a7e39be2911cd9447e0",
            measurementId: "G-7HM5JVWKHP"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const ADMIN_PIN = "8920"; // Aapka Secret Developer PIN

        function registerUserLogin() {
            const name = document.getElementById('userNameInput').value.trim();
            if (!name) {
                alert("Please enter your name first!");
                return;
            }

            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    saveLogToCloud(name, data.ip, "Logged into the site");
                    completeLogin(name);
                })
                .catch(() => {
                    saveLogToCloud(name, "IP Hidden / Local", "Logged into the site");
                    completeLogin(name);
                });
        }

        function completeLogin(name) {
            localStorage.setItem('current_user', name);
            document.getElementById('displayName').innerText = name;
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
        }

        function logUserActivity(activityText) {
            const name = localStorage.getItem('current_user') || "Unknown User";
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => saveLogToCloud(name, data.ip, activityText))
                .catch(() => saveLogToCloud(name, "Localhost", activityText));
            
            alert("Activity recorded to Cloud: " + activityText);
        }

        // --- SAVE TO FIRESTORE DATABASE ---
        function saveLogToCloud(name, ip, activity) {
            db.collection("site_logs").add({
                name: name,
                ip: ip,
                activity: activity,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(error => {
                console.error("Error adding document: ", error);
            });
        }

        // --- ADMIN PANEL & FETCHING FROM CLOUD ---
        function openAdminPanel() {
            let pin = prompt("Enter Developer Secret PIN:");
            if (pin === ADMIN_PIN) {
                document.getElementById('adminPanel').classList.remove('hidden');
                loadCloudLogsTable();
            } else {
                alert("Incorrect PIN! Access Denied.");
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanel').classList.add('hidden');
        }

        function loadCloudLogsTable() {
            let tbody = document.getElementById('logTableBody');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Loading from Cloud...</td></tr>`;

            db.collection("site_logs").orderBy("timestamp", "desc").get()
                .then((querySnapshot) => {
                    tbody.innerHTML = '';
                    if (querySnapshot.empty) {
                        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No logs found in database.</td></tr>`;
                        return;
                    }
                    querySnapshot.forEach((doc) => {
                        let log = doc.data();
                        let timeStr = log.timestamp ? log.timestamp.toDate().toLocaleString('en-IN') : 'Just now';
                        tbody.innerHTML += `
                            <tr>
                                <td>${timeStr}</td>
                                <td><b>${log.name}</b></td>
                                <td><span class="badge">${log.ip}</span></td>
                                <td>${log.activity}</td>
                            </tr>
                        `;
                    });
                })
                .catch((error) => {
                    console.error("Error getting documents: ", error);
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#ef4444;">Error loading logs. Check Firestore Rules.</td></tr>`;
                });
        }
    </script>
</body>
</html>
